<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учёт закупок</title>
<style>
  :root {
    --bg: #fafaf9; --card: #ffffff; --text: #1c1917; --muted: #78716c;
    --line: #e7e5e4; --accent: #1c1917; --buy: #1c1917; --ret: #16a34a; --neg: #dc2626;
    --c1:#2563eb; --c2:#f59e0b; --c3:#10b981; --c4:#ef4444; --c5:#8b5cf6; --c6:#06b6d4; --c7:#ec4899; --c8:#a8a29e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0c0a09; --card:#1c1917; --text:#f5f5f4; --muted:#a8a29e; --line:#292524;
      --accent:#f5f5f4; --buy:#f5f5f4; --ret:#4ade80; --neg:#f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:28px; }
  h1 { font-size: 22px; font-weight: 600; margin:0; letter-spacing:-.01em; }
  h2 { font-size: 13px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing:.06em; margin:0 0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .grid { display:grid; gap:16px; }
  .stats { grid-template-columns: repeat(3, 1fr); margin-bottom:16px; }
  .stat .label { font-size:13px; color:var(--muted); }
  .stat .value { font-size:26px; font-weight:600; letter-spacing:-.02em; margin-top:4px; font-variant-numeric: tabular-nums; }
  .charts { grid-template-columns: 1fr 1.4fr; margin-bottom:16px; }
  input, select, button { font:inherit; color:inherit; }
  input, select { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:9px 11px; width:100%; outline:none; }
  input:focus, select:focus { border-color: var(--muted); }
  button { cursor:pointer; border-radius:10px; padding:9px 14px; border:1px solid var(--line); background:var(--card); }
  button.primary { background:var(--accent); color:var(--bg); border-color:var(--accent); }
  button.ghost { border:none; background:none; color:var(--muted); padding:4px 8px; }
  button.ghost:hover { color:var(--neg); }
  .toggle { display:inline-flex; border:1px solid var(--line); border-radius:10px; padding:3px; background:var(--bg); }
  .toggle button { border:none; background:none; padding:6px 14px; border-radius:7px; color:var(--muted); }
  .toggle button.on { background:var(--card); color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  form.add { display:grid; gap:10px; align-items:center;
    grid-template-columns: auto 1fr 1fr 1fr auto;
    grid-template-areas: "type name name cat cat" "date qty amt amt btn"; }
  .a-type { grid-area:type; } .a-name { grid-area:name; } .a-cat { grid-area:cat; } .a-date { grid-area:date; }
  .a-qty { grid-area:qty; } .a-amt { grid-area:amt; } .a-btn { grid-area:btn; }
  .name-wrap { position:relative; min-width:0; }
  .name-wrap input { padding-right:44px; }
  .mic { position:absolute; right:4px; top:50%; transform:translateY(-50%); width:34px; height:34px; padding:0;
    display:grid; place-items:center; border:none; background:none; color:var(--muted); border-radius:8px; }
  .mic:hover { color:var(--text); background:var(--line); }
  .mic svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
  .mic.on { color:#fff; background:var(--neg); animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 6px color-mix(in srgb, var(--neg) 25%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .mic.on { animation:none; } }
  .voice-hint { grid-column:1 / -1; font-size:13px; color:var(--muted); margin:0; min-height:1em; }
  .stat .sub { font-size:13px; color:var(--muted); margin-top:2px; font-variant-numeric: tabular-nums; }
  .qty { color:var(--muted); font-size:13px; white-space:nowrap; }
  .qty-wrap { position:relative; min-width:0; }
  .qty-wrap input { padding-right:38px; }
  .qty-wrap::after { content:"шт."; position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:13px; pointer-events:none; }
  .table-box { overflow-x:auto; }
  .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .toolbar input[type=month] { width:auto; }
  table { width:100%; border-collapse:collapse; font-variant-numeric: tabular-nums; }
  th { text-align:left; font-weight:500; color:var(--muted); font-size:13px; padding:8px 6px; border-bottom:1px solid var(--line); }
  td { padding:10px 6px; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:none; }
  .r { text-align:right; white-space:nowrap; }
  .tag { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .tag.ret { color:var(--ret); border-color:currentColor; }
  .amt-ret { color:var(--ret); }
  .muted { color:var(--muted); }
  .empty { text-align:center; color:var(--muted); padding:32px 0; }
  .legend { list-style:none; padding:0; margin:14px 0 0; font-size:13px; }
  .legend li { display:flex; align-items:center; gap:8px; padding:3px 0; }
  .legend .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .legend .v { margin-left:auto; font-variant-numeric: tabular-nums; }
  .donut-box { display:flex; justify-content:center; }
  svg text { fill: var(--muted); font-size: 11px; }
  .links { display:flex; gap:6px; flex-wrap:wrap; }
  .links button { font-size:13px; padding:6px 10px; }
  .section-head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .section-head h2 { margin:0; }
  @media (max-width: 760px) {
    .stats { grid-template-columns: 1fr; }
    .charts { grid-template-columns: 1fr; }
    form.add { grid-template-columns: 1fr 1fr; grid-template-areas: "type type" "name name" "cat date" "qty amt" "btn btn"; }
    .mic { width:40px; height:40px; }
    th, td { padding-left:4px; padding-right:4px; }
    .yr { display:none; }
    .hide-sm { display:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Учёт закупок</h1>
    <div class="toolbar">
      <input type="month" id="period" title="Период">
      <button id="allTime">Всё время</button>
    </div>
  </header>

  <div class="grid stats">
    <div class="card stat"><div class="label">Куплено</div><div class="value" id="sBuy">0</div><div class="sub" id="sCount">0 покупок</div></div>
    <div class="card stat"><div class="label">Возвращено</div><div class="value amt-ret" id="sRet">0</div></div>
    <div class="card stat"><div class="label">Итого потрачено</div><div class="value" id="sNet">0</div></div>
  </div>

  <div class="grid charts">
    <div class="card">
      <h2>На что потрачено</h2>
      <div class="donut-box" id="donut"></div>
      <ul class="legend" id="legend"></ul>
    </div>
    <div class="card">
      <h2 id="barsTitle">По месяцам</h2>
      <div id="bars"></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <h2>Новая запись</h2>
    <form class="add" id="form" autocomplete="off">
      <div class="toggle a-type" id="typeToggle">
        <button type="button" data-t="buy" class="on">Покупка</button>
        <button type="button" data-t="ret">Возврат</button>
      </div>
      <div class="name-wrap a-name">
        <input id="fName" placeholder="Что" aria-label="Что" required>
        <button type="button" class="mic" id="mic" title="Голосовой ввод" aria-label="Голосовой ввод" hidden>
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
      </div>
      <input class="a-cat" id="fCat" placeholder="Категория" aria-label="Категория" list="cats" required>
      <input class="a-date" id="fDate" type="date" aria-label="Дата" required>
      <div class="qty-wrap a-qty"><input id="fQty" type="number" min="1" step="1" value="1" aria-label="Количество, шт." title="Количество" required></div>
      <input class="a-amt" id="fAmt" type="number" min="0" step="0.01" placeholder="Сумма" aria-label="Сумма" required>
      <button class="primary a-btn" type="submit">Добавить</button>
      <p class="voice-hint" id="voiceHint" hidden></p>
      <datalist id="cats"></datalist>
    </form>
  </div>

  <div class="card">
    <div class="section-head">
      <h2>Записи</h2>
      <div class="links">
        <button id="exportCsv">Excel (CSV)</button>
        <button id="exportJson">Резервная копия</button>
        <button id="importJson">Восстановить</button>
        <input type="file" id="importFile" accept=".json" hidden>
      </div>
    </div>
    <div class="table-box"><table>
      <thead><tr><th>Дата</th><th>Что</th><th class="hide-sm">Категория</th><th>Тип</th><th class="r">Сумма</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </div>
</div>

<script>
const KEY = 'purchases.v1';
const CURRENCY = '₸';
const DEFAULT_CATS = ['Канцелярия', 'Хозтовары', 'Продукты', 'Техника', 'Мебель', 'Транспорт', 'Прочее'];
const COLORS = ['--c1','--c2','--c3','--c4','--c5','--c6','--c7'].map(v => getComputedStyle(document.documentElement).getPropertyValue(v).trim());
const OTHER_COLOR = getComputedStyle(document.documentElement).getPropertyValue('--c8').trim();
const MONTHS = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];

let items = load();
let type = 'buy';
let period = ''; // '' = всё время, иначе 'YYYY-MM'

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch {} }
const $ = id => document.getElementById(id);
const money = n => Math.round(n).toLocaleString('ru-RU') + ' ' + CURRENCY;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtDate = d => { const [y,m,day] = d.split('-'); return `${day}.${m}.${y}`; };

const qtyOf = i => Number.isInteger(i.qty) && i.qty > 0 ? i.qty : 1;
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100;
  return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };

// ---- разбор голосовой фразы: «ноутбук 2 штуки 350 000 техника» ----
const NUM_WORDS = {один:1,одна:1,одну:1,два:2,две:2,три:3,четыре:4,пять:5,шесть:6,семь:7,восемь:8,девять:9,десять:10};
const NUM_RE = '(\\d+|' + Object.keys(NUM_WORDS).join('|') + ')';
const toNum = s => NUM_WORDS[s] || parseInt(s, 10);
function parseSpeech(text, knownCats) {
  let t = ' ' + text.toLowerCase().replace(/ё/g, 'е').replace(/[,;!?]/g, ' ').replace(/\.(?=\s|$)/g, ' ') + ' ';
  const r = {};
  const cut = re => { const m = t.match(re); if (m) t = t.replace(m[0], ' '); return m; };
  if (cut(/^\s*возврат\S*/)) r.type = 'ret';
  else if (cut(/^\s*(покупка|купил\S*)/)) r.type = 'buy';
  let m = cut(/\sкатегори\S*\s+(\S+)/);
  if (m) r.cat = m[1];
  m = cut(new RegExp('\\s' + NUM_RE + '\\s*(штук[аи]?|шт\\.?|единиц\\S*|пач\\S*|упаков\\S*|короб\\S*|рулон\\S*|комплект\\S*)(?=\\s)'));
  if (!m) m = cut(new RegExp('\\sколичеств\\S*\\s+' + NUM_RE + '(?=\\s)'));
  if (m) r.qty = toNum(m[1]);
  t = t.replace(/(\d+(?:[.,]\d+)?)\s*тыс\S*/g, (_, n) => String(Math.round(parseFloat(n.replace(',', '.')) * 1000)));
  t = t.replace(/(тенге|тг|₸|рубл\S*)/g, ' ');
  const nums = [...t.matchAll(/(?<=\s)(?:\d{1,3}(?:\s\d{3})+|\d+)(?:[.,]\d+)?(?=\s)/g)];
  if (nums.length) {
    const last = nums[nums.length - 1];
    r.amount = parseFloat(last[0].replace(/\s/g, '').replace(',', '.'));
    const before = t.slice(0, last.index);
    const each = /\sпо\s*$/.test(before);  // «по 25 000» — цена за штуку
    t = before.replace(/\sпо\s*$/, ' ') + ' ' + t.slice(last.index + last[0].length);
    if (!r.qty && nums.length > 1 && /^\s*\d+\s/.test(t)) { const q = t.match(/^\s*(\d+)\s/); r.qty = +q[1]; t = t.replace(q[0], ' '); }
    if (each && r.qty) r.amount = Math.round(r.amount * r.qty * 100) / 100;
  }
  if (!r.cat) for (const c of knownCats) {
    const stem = c.toLowerCase().slice(0, Math.max(4, c.length - 2));
    const cm = t.match(new RegExp('\\s(' + stem.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\S*)(?=\\s)'));
    if (cm) { r.cat = c; t = t.replace(cm[0], ' '); break; }
  }
  if (r.cat) { const k = knownCats.find(c => c.toLowerCase() === r.cat); r.cat = k || r.cat[0].toUpperCase() + r.cat.slice(1); }
  t = t.replace(/\s(за|на|сумм\S*|цен\S*|стоимост\S*|по)(?=\s)/g, ' ').replace(/\s+/g, ' ').trim();
  if (t) r.name = t[0].toUpperCase() + t.slice(1);
  return r;
}
function applySpeech(text) {
  const r = parseSpeech(text, [...new Set([...DEFAULT_CATS, ...items.map(i => i.cat)])]);
  if (r.type) $('typeToggle').querySelector(`[data-t=${r.type}]`).click();
  if (r.name) $('fName').value = r.name;
  if (r.cat) $('fCat').value = r.cat;
  if (r.qty) $('fQty').value = r.qty;
  if (r.amount) $('fAmt').value = r.amount;
  const empty = ['fName', 'fCat', 'fAmt'].find(id => !$(id).value);
  (empty ? $(empty) : document.querySelector('#form [type=submit]')).focus();
  return r;
}

function filtered() { return period ? items.filter(i => i.date.startsWith(period)) : items; }

// ---- форма ----
$('fDate').value = today();
$('typeToggle').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  type = b.dataset.t;
  [...$('typeToggle').children].forEach(x => x.classList.toggle('on', x === b));
});
$('form').addEventListener('submit', e => {
  e.preventDefault();
  items.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    type, name: $('fName').value.trim(), cat: $('fCat').value.trim(),
    date: $('fDate').value, amount: Math.abs(parseFloat($('fAmt').value) || 0),
    qty: Math.max(1, Math.round(parseFloat($('fQty').value) || 1))
  });
  save();
  $('fName').value = ''; $('fAmt').value = ''; $('fQty').value = '1';
  $('fName').focus();
  render();
});
$('rows').addEventListener('click', e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  if (!confirm('Удалить запись?')) return;
  items = items.filter(i => i.id !== b.dataset.del);
  save(); render();
});

// ---- голосовой ввод (Chrome, Edge, Safari) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function hint(text) { $('voiceHint').textContent = text; $('voiceHint').hidden = !text; }
if (SR) {
  $('mic').hidden = false;
  let rec = null;
  $('mic').addEventListener('click', () => {
    if (rec) { rec.stop(); return; }
    rec = new SR();
    rec.lang = 'ru-RU'; rec.interimResults = true; rec.continuous = false;
    let finalText = '';
    rec.onstart = () => { $('mic').classList.add('on'); hint('Говорите: «Бумага А4 5 пачек 12 500 канцелярия»'); };
    rec.onresult = e => {
      let interim = '';
      for (let k = e.resultIndex; k < e.results.length; k++) {
        if (e.results[k].isFinal) finalText += e.results[k][0].transcript + ' ';
        else interim += e.results[k][0].transcript;
      }
      hint('Слышу: ' + (finalText + interim).trim());
    };
    rec.onerror = e => {
      hint(e.error === 'not-allowed' || e.error === 'service-not-allowed'
        ? 'Нет доступа к микрофону. Разрешите его в настройках браузера для этого сайта.'
        : e.error === 'no-speech' ? 'Ничего не услышал. Нажмите на микрофон и скажите ещё раз.'
        : 'Голосовой ввод не сработал. Попробуйте ещё раз.');
    };
    rec.onend = () => {
      $('mic').classList.remove('on'); rec = null;
      if (finalText.trim()) { applySpeech(finalText); hint('Распознано: «' + finalText.trim() + '». Проверьте поля и нажмите «Добавить».'); }
    };
    try { rec.start(); } catch { rec = null; hint('Голосовой ввод не сработал. Попробуйте ещё раз.'); }
  });
}

// ---- период ----
$('period').addEventListener('change', e => { period = e.target.value; render(); });
$('allTime').addEventListener('click', () => { period = ''; $('period').value = ''; render(); });

// ---- рендер ----
function render() {
  const list = filtered();
  const buy = list.filter(i => i.type === 'buy').reduce((s,i) => s + i.amount, 0);
  const ret = list.filter(i => i.type === 'ret').reduce((s,i) => s + i.amount, 0);
  const buys = list.filter(i => i.type === 'buy');
  const units = buys.reduce((s,i) => s + qtyOf(i), 0);
  $('sCount').textContent = `${buys.length} ${plural(buys.length, 'покупка', 'покупки', 'покупок')} · ${units} шт.`;
  $('sBuy').textContent = money(buy);
  $('sRet').textContent = money(ret);
  $('sNet').textContent = money(buy - ret);
  $('allTime').classList.toggle('primary', !period);

  const cats = [...new Set([...DEFAULT_CATS, ...items.map(i => i.cat)])];
  $('cats').innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');

  renderTable(list);
  renderDonut(list);
  renderBars();
}

function renderTable(list) {
  const sorted = [...list].sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  $('rows').innerHTML = sorted.length ? sorted.map(i => `
    <tr>
      <td class="muted" style="white-space:nowrap">${fmtDate(i.date).slice(0,5)}<span class="yr">${fmtDate(i.date).slice(5)}</span></td>
      <td>${esc(i.name)}${qtyOf(i) > 1 ? ` <span class="qty">× ${qtyOf(i)}</span>` : ''}</td>
      <td class="hide-sm muted">${esc(i.cat)}</td>
      <td><span class="tag ${i.type === 'ret' ? 'ret' : ''}">${i.type === 'ret' ? 'возврат' : 'покупка'}</span></td>
      <td class="r ${i.type === 'ret' ? 'amt-ret' : ''}">${i.type === 'ret' ? '−' : ''}${money(i.amount)}</td>
      <td class="r"><button class="ghost" data-del="${i.id}" title="Удалить">✕</button></td>
    </tr>`).join('') : `<tr><td colspan="6" class="empty">Пока нет записей</td></tr>`;
}

function renderDonut(list) {
  const by = {};
  list.forEach(i => { by[i.cat] = (by[i.cat] || 0) + (i.type === 'ret' ? -i.amount : i.amount); });
  let data = Object.entries(by).filter(([,v]) => v > 0).sort((a,b) => b[1] - a[1]);
  if (data.length > 7) {
    const rest = data.slice(6).reduce((s,[,v]) => s + v, 0);
    data = [...data.slice(0,6), ['Остальное', rest]];
  }
  const total = data.reduce((s,[,v]) => s + v, 0);
  const R = 70, r = 48, C = 90;
  if (!total) {
    $('donut').innerHTML = `<svg width="180" height="180"><circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="var(--line)" stroke-width="${R-r}"/><text x="${C}" y="${C+4}" text-anchor="middle">нет данных</text></svg>`;
    $('legend').innerHTML = '';
    return;
  }
  let a = -Math.PI / 2, paths = '';
  const color = (i, name) => name === 'Остальное' ? OTHER_COLOR : COLORS[i % COLORS.length];
  data.forEach(([name, v], i) => {
    const frac = v / total;
    const a2 = a + frac * Math.PI * 2 - (data.length > 1 ? 0.012 : 0);
    if (frac >= 0.9999) {
      paths += `<circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="${color(i,name)}" stroke-width="${R-r}"/>`;
    } else {
      const large = (a2 - a) > Math.PI ? 1 : 0;
      const p = (rad, ang) => `${C + rad*Math.cos(ang)},${C + rad*Math.sin(ang)}`;
      paths += `<path fill="${color(i,name)}" d="M${p(R,a)} A${R},${R} 0 ${large} 1 ${p(R,a2)} L${p(r,a2)} A${r},${r} 0 ${large} 0 ${p(r,a)}Z"><title>${esc(name)}: ${money(v)}</title></path>`;
    }
    a += frac * Math.PI * 2;
  });
  $('donut').innerHTML = `<svg width="180" height="180" viewBox="0 0 180 180">${paths}
    <text x="${C}" y="${C-2}" text-anchor="middle" style="fill:var(--text);font-size:15px;font-weight:600">${Math.round(total).toLocaleString('ru-RU')}</text>
    <text x="${C}" y="${C+15}" text-anchor="middle">${CURRENCY} всего</text></svg>`;
  $('legend').innerHTML = data.map(([name, v], i) => `
    <li><span class="dot" style="background:${color(i,name)}"></span>${esc(name)}
    <span class="muted">${Math.round(v/total*100)}%</span><span class="v">${money(v)}</span></li>`).join('');
}

function renderBars() {
  // Если выбран месяц — по дням этого месяца, иначе — последние 12 месяцев
  let keys, labels, title;
  if (period) {
    const [y, m] = period.split('-').map(Number);
    const days = new Date(y, m, 0).getDate();
    keys = Array.from({length: days}, (_, i) => `${period}-${String(i+1).padStart(2,'0')}`);
    labels = keys.map((_, i) => (i+1) % 5 === 0 || i === 0 ? String(i+1) : '');
    title = `По дням · ${MONTHS[m-1]} ${y}`;
  } else {
    const now = new Date(); keys = []; labels = [];
    for (let k = 11; k >= 0; k--) {
      const d = new Date(now.getFullYear(), now.getMonth() - k, 1);
      keys.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
      labels.push(MONTHS[d.getMonth()]);
    }
    title = 'По месяцам · последние 12';
  }
  $('barsTitle').textContent = title;
  const vals = keys.map(k => items.filter(i => i.date.startsWith(k))
    .reduce((s,i) => s + (i.type === 'ret' ? -i.amount : i.amount), 0));
  const max = Math.max(...vals.map(v => Math.max(v, 0)), 1);
  const W = 520, H = 230, padB = 22, padT = 24, n = keys.length;
  const bw = W / n, inner = Math.max(bw * (n > 15 ? 0.7 : 0.55), 2);
  const bars = vals.map((v, i) => {
    const h = Math.max(v, 0) / max * (H - padB - padT);
    const x = i * bw + (bw - inner) / 2;
    return `<rect x="${x}" y="${H - padB - h}" width="${inner}" height="${Math.max(h, v > 0 ? 2 : 0)}" rx="3" fill="var(--c1)"><title>${labels[i] || keys[i]}: ${money(v)}</title></rect>
      <text x="${i*bw + bw/2}" y="${H - 6}" text-anchor="middle">${labels[i]}</text>`;
  }).join('');
  const peak = vals.indexOf(Math.max(...vals));
  const peakLbl = vals[peak] > 0 ? `<text x="${W}" y="12" text-anchor="end">макс. ${money(vals[peak])}</text>` : '';
  $('bars').innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;height:auto">
    <line x1="0" x2="${W}" y1="${H-padB}" y2="${H-padB}" stroke="var(--line)"/>${bars}${peakLbl}</svg>`;
}

// ---- экспорт / импорт ----
function download(name, text, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type: mime}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('exportCsv').addEventListener('click', () => {
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const rows = [['Дата','Что','Категория','Тип','Кол-во','Сумма'],
    ...[...filtered()].sort((a,b) => a.date.localeCompare(b.date))
      .map(i => [fmtDate(i.date), i.name, i.cat, i.type === 'ret' ? 'Возврат' : 'Покупка', qtyOf(i), String(i.type === 'ret' ? -i.amount : i.amount).replace('.', ',')])];
  download(`zakupki${period ? '-' + period : ''}.csv`, '﻿' + rows.map(r => r.map(q).join(';')).join('\n'), 'text/csv');
});
$('exportJson').addEventListener('click', () => download(`zakupki-backup-${today()}.json`, JSON.stringify(items, null, 1), 'application/json'));
$('importJson').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const ok = i => i && (i.type === 'buy' || i.type === 'ret') && typeof i.name === 'string' && typeof i.cat === 'string'
      && /^\d{4}-\d{2}-\d{2}$/.test(i.date) && typeof i.amount === 'number' && i.amount >= 0
      && (i.qty === undefined || (Number.isInteger(i.qty) && i.qty >= 1));
    if (!Array.isArray(data) || !data.every(ok)) throw 0;
    data.forEach(i => { i.id = i.id ? String(i.id) : Date.now().toString(36) + Math.random().toString(36).slice(2,6); });
    if (!confirm(`Заменить текущие данные (${items.length} записей) на копию (${data.length} записей)?`)) return;
    items = data; save(); render();
  } catch { alert('Не удалось прочитать файл'); }
});

render();
</script>
